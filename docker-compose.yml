services:
  postgres:
    image: postgres:16
    container_name: paragliding-logbook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: paragliding_logbook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d paragliding_logbook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
